[package]
name = "linenb-backend"
version = "0.1.0"
edition = "2021"
publish = false
# 멀티 바이너리 (linenb-backend, seed)에서 `cargo run`이 어느 걸 실행할지 명시.
# 서버는 그냥 `cargo run`, 시드는 `cargo run --bin seed`.
default-run = "linenb-backend"

[dependencies]
tokio              = { version = "1", features = ["full"] }
axum               = { version = "0.7", features = ["macros"] }
tower              = "0.5"
tower-http         = { version = "0.6", features = ["cors", "trace"] }
sqlx               = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "macros", "migrate"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
chrono             = { version = "0.4", features = ["serde"] }
jsonwebtoken       = "9"
argon2             = "0.5"
thiserror          = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy            = "0.15"
validator          = { version = "0.18", features = ["derive"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
