services:
  mysql:
    image: mysql:8.4
    container_name: linenb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: linenb
      MYSQL_USER: linenb
      MYSQL_PASSWORD: dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdev"]
      interval: 5s
      timeout: 3s
      retries: 12

  adminer:
    image: adminer
    container_name: linenb-adminer
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
